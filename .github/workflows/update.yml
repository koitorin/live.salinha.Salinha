name: Check Upstream Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new upstream release
        uses: flathub/flatpak-external-data-checker@v1
        with:
          manifest-path: live.salinha.Salinha.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}

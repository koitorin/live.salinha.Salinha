name: Check Upstream Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-external-data-checker:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: flatpak-external-data-checker --update live.salinha.Salinha.yaml
